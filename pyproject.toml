[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "surgical-skill-identity"
version = "0.1.0"
description = "Leakage-resistant multi-dataset surgical skill preprocessing and identity audit"
requires-python = ">=3.12,<3.14"
dependencies = [
  "mat-io==1.0.0",
  "numpy==2.3.5",
  "openpyxl==3.1.5",
  "pandas==2.2.3",
  "pyarrow==25.0.1",
  "pyyaml==6.0.3",
  "scikit-learn==1.9.1",
  "scipy==1.16.2",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/surgical_skill2"]
